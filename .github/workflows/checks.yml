name: Host checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y g++ libcurl4-openssl-dev
      - run: python3 -m unittest -v test_bridge test_muse_adapter test_agent_handler test_document_delivery test_vault_intake test_library_control
      - run: python3 -m unittest discover -s device -p 'test_*.py'
      - run: node device/test_model.js
      - run: sh -n send.sh device/build.sh
    env:
      PYTHONDONTWRITEBYTECODE: '1'
